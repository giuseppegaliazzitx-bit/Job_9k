<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Software Engineer at Stripe</title>
</head>
<body>
  <div id="app_body">
    <h1 class="app-title">Software Engineer</h1>
    <div class="job-post">
      <div class="job-post-content">Build payments infrastructure with TypeScript and Ruby.</div>
    </div>
    <form id="application_form">
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" required />
      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" type="text" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />
      <label for="resume">Resume/CV</label>
      <input id="resume" name="resume" type="file" accept=".pdf" />
      <label for="cover_letter">Cover Letter</label>
      <input id="cover_letter" name="cover_letter" type="file" />
      <label for="linkedin">LinkedIn Profile</label>
      <input id="linkedin" name="question_linkedin" type="text" />
      <label for="authorized">Are you authorized to work in the US?</label>
      <select id="authorized" name="question_authorized">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>
      <label for="sponsor">Will you now or in the future require sponsorship?</label>
      <select id="sponsor" name="question_sponsor">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>
      <button id="submit_app" type="submit">Submit application</button>
    </form>
    <footer>Powered by Greenhouse</footer>
  </div>
</body>
</html>
