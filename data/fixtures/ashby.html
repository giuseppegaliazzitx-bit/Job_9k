<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ML Engineer at OpenAI</title>
</head>
<body>
  <div data-testid="ashby-job-posting">
    <h1>ML Engineer</h1>
    <div class="job-description">Train and serve models. Python, PyTorch.</div>
    <form>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label>Do you require visa sponsorship?</label>
      <button type="button">Yes</button>
      <button type="button">No</button>
      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" />
      <button type="submit">Submit application</button>
    </form>
  </div>
  <footer>Powered by Ashby</footer>
</body>
</html>
