<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backend Engineer at Netflix</title>
</head>
<body>
  <div class="posting">
    <h2>Backend Engineer</h2>
    <div class="posting-description">Streaming backend work in Java and Python.</div>
  </div>
  <form class="application-form lever-application-form" action="/apply">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" />
    <label for="email">Email</label>
    <input id="email" name="email" type="email" />
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />
    <label for="urls">LinkedIn URL</label>
    <input id="urls" name="urls[LinkedIn]" type="text" />
    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" />
    <label>
      <input type="checkbox" name="consent" /> I agree to the privacy policy
    </label>
    <button type="submit">Submit application</button>
  </form>
  <footer>Powered by Lever</footer>
</body>
</html>
