browser:
  headed: true
  slow_mo_ms: 50
  typing_delay_ms: 40

# Global auto-submit is off. Even if enabled, only allowlisted ATS may submit,
# and only when every required field mapped with confidence "filled".
auto_submit:
  enabled: false
  allowlist:
    - greenhouse
    - lever

llm:
  # none | openai-compatible | anthropic
  provider: none
  # SpaceXAI (xAI) is the default OpenAI-compatible target.
  base_url: https://api.x.ai/v1
  model: grok-4.6
  api_key_env: XAI_API_KEY

# Gmail IMAP for login / create-account verification codes. Off by default.
# Use a Gmail App Password, not your normal password:
# https://myaccount.google.com/apppasswords
otp:
  enabled: false
  email: ""
  app_password: ""
  host: imap.gmail.com
  port: 993
  max_wait_sec: 90

# Stored ATS logins. Used to sign in or create an account, then the fill
# continues. Auto-submit stays off unless you enable it above.
accounts:
  workday:
    email: ""
    password: ""

data_dir: ./data
